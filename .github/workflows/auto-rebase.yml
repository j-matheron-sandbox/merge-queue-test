name: Rebuild queue with a real rebase of the next entry
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get queue snapshot, ordered by position
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          gh api graphql -f query='
            query($owner: String!, $repo: String!) {
              repository(owner: $owner, name: $repo) {
                mergeQueue {
                  entries(first: 50) {
                    nodes {
                      position
                      pullRequest { id number headRefName }
                    }
                  }
                }
              }
            }' -F owner="$OWNER" -F repo="$REPO" \
            --jq '.data.repository.mergeQueue.entries.nodes | sort_by(.position)' > ordered.json
          echo "Queue snapshot:"
          cat ordered.json

      - name: Dequeue every entry currently in the queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -c '.[]' ordered.json | while read -r entry; do
            PR_ID=$(echo "$entry" | jq -r '.pullRequest.id')
            PR_NUM=$(echo "$entry" | jq -r '.pullRequest.number')
            echo "Dequeuing PR #$PR_NUM"
            gh api graphql -f query='mutation($id: ID!) { dequeuePullRequest(input: {id: $id}) { clientMutationId } }' -F id="$PR_ID"
          done

      - name: Real rebase of the front entry only
        run: |
          COUNT=$(jq 'length' ordered.json)
          if [ "$COUNT" -eq 0 ]; then
            echo "Queue was empty, nothing to rebase"
            exit 0
          fi

          FIRST_BRANCH=$(jq -r '.[0].pullRequest.headRefName' ordered.json)
          echo "Rebasing $FIRST_BRANCH onto main for real"
          git fetch origin "$FIRST_BRANCH"
          git checkout -B "$FIRST_BRANCH" "origin/$FIRST_BRANCH"
          if git rebase origin/main; then
            if git push --force-with-lease origin "$FIRST_BRANCH"; then
              echo "$FIRST_BRANCH: rebase OK, pushed"
            else
              echo "$FIRST_BRANCH: rebase OK locally, but push rejected"
            fi
          else
            git rebase --abort
            echo "$FIRST_BRANCH: conflict, rebase aborted"
          fi

      - name: Re-enqueue every PR, in its original order
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -c '.[]' ordered.json | while read -r entry; do
            PR_ID=$(echo "$entry" | jq -r '.pullRequest.id')
            PR_NUM=$(echo "$entry" | jq -r '.pullRequest.number')
            echo "Re-enqueuing PR #$PR_NUM"
            gh api graphql -f query='mutation($id: ID!) { enqueuePullRequest(input: {pullRequestId: $id}) { clientMutationId } }' -F id="$PR_ID"
          done
